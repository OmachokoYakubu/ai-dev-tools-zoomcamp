services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_password
      POSTGRES_DB: agent_relay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d agent_relay"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-relay-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RELAY_DATABASE_URL=postgresql+psycopg://relay:relay_password@postgres:5432/agent_relay
      - RELAY_LEASE_SECONDS=60
      - RELAY_MAX_ATTEMPTS=5
      - RELAY_RECOVERY_INTERVAL_SECONDS=5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
