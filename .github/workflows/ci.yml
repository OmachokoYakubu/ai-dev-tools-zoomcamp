name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Homework 3 (Agent Relay)
        working-directory: ./homework-3-agent-relay
        run: |
          uv sync
          uv run pytest -v

  build-and-verify-deployment:
    name: Build Image & Verify Manifests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Agent Relay Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./homework-3-agent-relay
          file: ./homework-3-agent-relay/Dockerfile
          push: false
          tags: agent-relay:latest

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -k ./homework-3-agent-relay/k8s
