global:
  resolve_timeout: 1m

route:
  receiver: oncall-responder-agent
  group_by: ["alertname", "service"]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 5m

receivers:
  - name: oncall-responder-agent
    webhook_configs:
      - url: "http://oncall-agent:8081/alerts"
        send_resolved: true
