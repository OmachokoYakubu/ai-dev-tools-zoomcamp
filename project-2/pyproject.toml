[project]
name = "shelfsync-platform"
version = "1.0.0"
description = "ShelfSync: Clinic & Pharmacy Cold-Chain Inventory, Restock Automation & Autonomous On-Call Self-Healing Platform (AI Dev Tools Zoomcamp 2026 Project 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "prometheus-client>=0.21.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
